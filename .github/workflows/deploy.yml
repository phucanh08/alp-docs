name: Deploy to GitHub Pages

# Content không nằm trong repo này. `prebuild` gọi scripts/fetch-docs.mjs để kéo
# docs/user/ của alp-code@main về trước khi Astro chạy, nên site được build lại vì
# một trong hai lý do: khung site ở repo này đổi, hoặc content bên alp-code đổi.

on:
  # Khung site đổi.
  push:
    branches: [main]
  # Content bên alp-code đổi. alp-code không bắn gì sang — làm vậy cần token của repo
  # này nằm trong secret của một repo public — nên repo này tự hỏi mỗi giờ.
  schedule:
    - cron: "0 * * * *"
  # Đường đi tức thì: `gh workflow run deploy.yml -R phucanh08/alp-docs` từ máy
  # maintainer sau khi push docs/user/. Xem docs/user/README.md bên alp-code.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          DEPLOY_TARGET: github-pages
          DEPLOY_SITE: https://alp.anhlp.com
          # Ref của alp-code mà content được lấy từ đó. Đổi sang một tag ở đây là
          # chuyển site sang mô tả stable thay vì source HEAD.
          ALP_CODE_REF: main

      - name: Ghi lại content được build từ đâu
        if: always()
        run: |
          SHA=$(curl -sS -H "authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/phucanh08/alp-code/commits/main \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          echo "Content lấy từ [phucanh08/alp-code@\`${SHA:0:7}\`](https://github.com/phucanh08/alp-code/commit/$SHA)." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
